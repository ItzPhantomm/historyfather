<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d"/>
      <stop offset="60%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <!-- Edge Glow Gradients -->
    <linearGradient id="edgeGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="edgeGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="edgeGlow3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes flowPacket {
      0% { stroke-dashoffset: 480; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePulse {
      0%, 100% { r: 16; opacity: 0.9; }
      50% { r: 21; opacity: 0.5; }
    }
    @keyframes satellitePulse {
      0%, 100% { r: 12; opacity: 0.85; }
      50% { r: 15; opacity: 0.45; }
    }
    @keyframes timeTravelScrub {
      0% { transform: translateX(60px); }
      50% { transform: translateX(800px); }
      100% { transform: translateX(60px); }
    }
    @keyframes labelFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .edge-bg { stroke: #1e2436; stroke-width: 1.5; fill: none; }
    .packet-fast {
      fill: none;
      stroke-dasharray: 40 280;
      animation: flowPacket 3.2s linear infinite;
    }
    .packet-med {
      fill: none;
      stroke-dasharray: 50 320;
      animation: flowPacket 4.5s linear infinite;
    }
    .packet-rev {
      fill: none;
      stroke-dasharray: 45 300;
      animation: flowPacket 3.8s linear infinite reverse;
    }
    .center-halo {
      animation: nodePulse 3s ease-in-out infinite;
      transform-origin: 450px 150px;
    }
    .sat-halo-1 {
      animation: satellitePulse 2.8s ease-in-out infinite;
      transform-origin: 220px 85px;
    }
    .sat-halo-2 {
      animation: satellitePulse 3.4s ease-in-out infinite;
      transform-origin: 680px 85px;
    }
    .sat-halo-3 {
      animation: satellitePulse 3.1s ease-in-out infinite;
      transform-origin: 180px 220px;
    }
    .sat-halo-4 {
      animation: satellitePulse 2.6s ease-in-out infinite;
      transform-origin: 720px 220px;
    }
    .scrubber {
      animation: timeTravelScrub 10s ease-in-out infinite;
    }
    .floating-badge {
      animation: labelFloat 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="360" fill="url(#canvasBg)" rx="14"/>
  <rect width="900" height="360" fill="none" stroke="#212738" stroke-width="1.5" rx="14"/>

  <!-- Subtle Tactical Grid Overlay -->
  <g opacity="0.35" stroke="#1c2233" stroke-width="0.7">
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="260" y1="0" x2="260" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="820" y1="0" x2="820" y2="360"/>
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="0" y1="230" x2="900" y2="230"/>
  </g>

  <!-- Top HUD Status Bar -->
  <g transform="translate(32, 28)">
    <rect width="250" height="22" rx="4" fill="#10141f" stroke="#1f273b" stroke-width="1"/>
    <circle cx="12" cy="11" r="3" fill="#38bdf8"/>
    <text x="22" y="15" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600" letter-spacing="1">
      TEMPORAL_GRAPH // LIVE RECONSTRUCTION
    </text>
  </g>

  <g transform="translate(638, 28)">
    <rect width="230" height="22" rx="4" fill="#10141f" stroke="#1f273b" stroke-width="1"/>
    <text x="12" y="15" fill="#a1a1aa" font-family="monospace" font-size="10">
      PROVENANCE: <tspan fill="#34d399" font-weight="700">VERIFIABLE_EXCERPT</tspan>
    </text>
  </g>

  <!-- Graph Edge Paths (Curved Splines) -->
  <!-- Edge: Center (450,150) -> Top-Left (220,85) -->
  <path d="M 450 150 Q 320 100 220 85" class="edge-bg"/>
  <path d="M 450 150 Q 320 100 220 85" class="packet-fast" stroke="url(#edgeGlow1)" stroke-width="2.5" filter="url(#neon)"/>

  <!-- Edge: Center (450,150) -> Top-Right (680,85) -->
  <path d="M 450 150 Q 580 100 680 85" class="edge-bg"/>
  <path d="M 450 150 Q 580 100 680 85" class="packet-med" stroke="url(#edgeGlow2)" stroke-width="2.5" filter="url(#neon)"/>

  <!-- Edge: Center (450,150) -> Bottom-Left (180,220) -->
  <path d="M 450 150 Q 300 200 180 220" class="edge-bg"/>
  <path d="M 450 150 Q 300 200 180 220" class="packet-rev" stroke="#38bdf8" stroke-width="2.5" filter="url(#neon)"/>

  <!-- Edge: Center (450,150) -> Bottom-Right (720,220) -->
  <path d="M 450 150 Q 600 200 720 220" class="edge-bg"/>
  <path d="M 450 150 Q 600 200 720 220" class="packet-fast" stroke="#10b981" stroke-width="2.5" filter="url(#neon)"/>

  <!-- Cross-Edge: Top-Left (220,85) -> Bottom-Left (180,220) -->
  <path d="M 220 85 C 160 130 160 170 180 220" class="edge-bg" stroke-dasharray="3 3"/>

  <!-- Edge Badges (Relationship Types) -->
  <g transform="translate(320, 102)" class="floating-badge">
    <rect width="66" height="18" rx="3" fill="#141824" stroke="#25304a" stroke-width="1"/>
    <text x="33" y="12" fill="#38bdf8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">TARGETS</text>
  </g>

  <g transform="translate(540, 102)" class="floating-badge">
    <rect width="66" height="18" rx="3" fill="#141824" stroke="#25304a" stroke-width="1"/>
    <text x="33" y="12" fill="#f59e0b" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">DEPLOYS</text>
  </g>

  <g transform="translate(290, 190)">
    <rect width="90" height="18" rx="3" fill="#141824" stroke="#25304a" stroke-width="1"/>
    <text x="45" y="12" fill="#818cf8" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">ATTRIBUTED_TO</text>
  </g>

  <g transform="translate(560, 190)">
    <rect width="84" height="18" rx="3" fill="#141824" stroke="#25304a" stroke-width="1"/>
    <text x="42" y="12" fill="#34d399" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">EXPLOITS</text>
  </g>

  <!-- Node 1: Top-Left (SolarWinds Orion) -->
  <g transform="translate(220, 85)">
    <circle cx="0" cy="0" r="14" fill="#0c121e" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="1" class="sat-halo-1"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
    <text x="0" y="-22" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SolarWinds Orion</text>
    <text x="0" y="-10" fill="#71717a" font-family="monospace" font-size="9" text-anchor="middle">ORGANIZATION</text>
  </g>

  <!-- Node 2: Top-Right (SUNBURST Backdoor) -->
  <g transform="translate(680, 85)">
    <circle cx="0" cy="0" r="14" fill="#181308" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#f59e0b" stroke-width="1" class="sat-halo-2"/>
    <circle cx="0" cy="0" r="5" fill="#f59e0b"/>
    <text x="0" y="-22" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">SUNBURST</text>
    <text x="0" y="-10" fill="#71717a" font-family="monospace" font-size="9" text-anchor="middle">MALWARE // TROJAN</text>
  </g>

  <!-- Node 3: Bottom-Left (Sandworm / NotPetya Cluster) -->
  <g transform="translate(180, 220)">
    <circle cx="0" cy="0" r="14" fill="#130b1c" stroke="#a855f7" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#a855f7" stroke-width="1" class="sat-halo-3"/>
    <circle cx="0" cy="0" r="5" fill="#a855f7"/>
    <text x="0" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Sandworm Team</text>
    <text x="0" y="38" fill="#71717a" font-family="monospace" font-size="9" text-anchor="middle">GRU UNIT 74455</text>
  </g>

  <!-- Node 4: Bottom-Right (Lazarus / Ronin Heist) -->
  <g transform="translate(720, 220)">
    <circle cx="0" cy="0" r="14" fill="#0a1610" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#10b981" stroke-width="1" class="sat-halo-4"/>
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
    <text x="0" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Axie Ronin Bridge</text>
    <text x="0" y="38" fill="#71717a" font-family="monospace" font-size="9" text-anchor="middle">INFRASTRUCTURE // $620M</text>
  </g>

  <!-- Central Hub Node: APT29 (Russian SVR) -->
  <g transform="translate(450, 150)">
    <!-- Expanding Halo Pulse -->
    <circle cx="0" cy="0" r="22" fill="#f43f5e" opacity="0.15" class="center-halo" filter="url(#strongGlow)"/>
    <circle cx="0" cy="0" r="18" fill="#1c0a0e" stroke="#f43f5e" stroke-width="2.5" filter="url(#neon)"/>
    <circle cx="0" cy="0" r="7" fill="#f43f5e"/>
    
    <text x="0" y="34" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="0.5">
      APT29 // SVR
    </text>
    <text x="0" y="47" fill="#fb7185" font-family="monospace" font-size="10" font-weight="600" text-anchor="middle">
      MIDNIGHT BLIZZARD (CONF: 99.4%)
    </text>
  </g>

  <!-- Bottom Timeline Scrubber Axis -->
  <g transform="translate(40, 310)">
    <!-- Base track -->
    <line x1="20" y1="12" x2="800" y2="12" stroke="#1e2436" stroke-width="2"/>
    
    <!-- Years Tick Marks -->
    <g font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">
      <circle cx="60" cy="12" r="2.5" fill="#38bdf8"/>
      <text x="60" y="26">2014</text>

      <circle cx="210" cy="12" r="2.5" fill="#38bdf8"/>
      <text x="210" y="26">2017 [NotPetya]</text>

      <circle cx="420" cy="12" r="2.5" fill="#f43f5e"/>
      <text x="420" y="26">2020 [SolarWinds]</text>

      <circle cx="620" cy="12" r="2.5" fill="#10b981"/>
      <text x="620" y="26">2022 [Ronin]</text>

      <circle cx="780" cy="12" r="2.5" fill="#c084fc"/>
      <text x="780" y="26">2024 [MSTIC]</text>
    </g>

    <!-- Moving Timeline Scrubber Cursor -->
    <g class="scrubber">
      <line x1="0" y1="-8" x2="0" y2="18" stroke="#38bdf8" stroke-width="2" filter="url(#neon)"/>
      <polygon points="-4,-8 4,-8 0,-2" fill="#38bdf8"/>
      <polygon points="-4,18 4,18 0,12" fill="#38bdf8"/>
    </g>
  </g>
</svg>
